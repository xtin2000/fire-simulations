[project]
name = "fire-sim"
version = "0.1.0"
description = "Real grass fires (RxCADRE 2012, CSIRO 1986) simulated in FDS level-set mode, FDS full physics and ELMFIRE"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
